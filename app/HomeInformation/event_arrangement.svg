<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" style="background-color:#EBE5D9;font-family:'Helvetica Neue',Helvetica,Arial,'PingFang TC','Heiti TC','Microsoft JhengHei',sans-serif;">
    <style>
        .stem  { stroke:#555; stroke-width:1.5 }
        .axis  { stroke:#555; stroke-width:2 }
        .node  { fill:#EBE5D9; stroke:#555; stroke-width:2 }
        .dot   { fill:#555 }
        .date  { fill:#555; font-size:20px; text-anchor:middle; letter-spacing:1px }
        .label { fill:#444; font-size:26px; text-anchor:middle; font-weight:bold; letter-spacing:1px }
    </style>

    <line x1="50" y1="230" x2="1350" y2="230" class="axis"/>

    <line x1="100" y1="230" x2="100" y2="145" class="stem"/>
    <circle cx="100" cy="230" r="5" class="node"/>
    <circle cx="100" cy="145" r="3" class="dot"/>
    <text x="100" y="122" class="date">4/27</text>
    <rect x="46" y="72" width="108" height="32" rx="4" fill="#F8DA76"/>
    <text x="100" y="93" class="label">報名開始</text>

    <line x1="300" y1="230" x2="300" y2="315" class="stem"/>
    <circle cx="300" cy="230" r="5" class="node"/>
    <circle cx="300" cy="315" r="3" class="dot"/>
    <text x="300" y="348" class="date">5/31</text>
    <text x="300" y="378" class="label">報名結束</text>

    <line x1="500" y1="230" x2="500" y2="145" class="stem"/>
    <circle cx="500" cy="230" r="5" class="node"/>
    <circle cx="500" cy="145" r="3" class="dot"/>
    <text x="500" y="122" class="date">6/6</text>
    <text x="500" y="90" class="label">正賽名單公布</text>

    <line x1="700" y1="230" x2="700" y2="315" class="stem"/>
    <circle cx="700" cy="230" r="5" class="node"/>
    <circle cx="700" cy="315" r="3" class="dot"/>
    <text x="700" y="348" class="date">6/13</text>
    <text x="700" y="378" class="label">遞補備取通知</text>

    <line x1="900" y1="230" x2="900" y2="145" class="stem"/>
    <circle cx="900" cy="230" r="5" class="node"/>
    <circle cx="900" cy="145" r="3" class="dot"/>
    <text x="900" y="122" class="date">7/11</text>
    <text x="900" y="90" class="label">遞補名單公布</text>

    <line x1="1100" y1="230" x2="1100" y2="315" class="stem"/>
    <circle cx="1100" cy="230" r="5" class="node"/>
    <circle cx="1100" cy="315" r="3" class="dot"/>
    <text x="1100" y="348" class="date">8/1</text>
    <text x="1100" y="378" class="label">賽前工作坊</text>

    <line x1="1300" y1="230" x2="1300" y2="145" class="stem"/>
    <circle cx="1300" cy="230" r="5" class="node"/>
    <circle cx="1300" cy="145" r="3" class="dot"/>
    <text x="1300" y="122" class="date">8/17–8/18</text>
    <rect x="1237" y="72" width="126" height="32" rx="4" fill="#F8DA76"/>
    <text x="1300" y="93" class="label">黑客松競賽</text>
</svg>